<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Futrx IDE</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#0f1014" />
<meta name="application-name" content="Futrx IDE" />
<meta name="apple-mobile-web-app-title" content="Futrx IDE" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  /* Palette mirrors the main Remote app (tailwind.config.ts: ink + accent). */
  :root {
    color-scheme: dark;
    --bg: #0f1014;          /* ink-900, app root background */
    --panel: #101318;       /* app sidebar / window frame */
    --line: rgba(255,255,255,.10);
    --ink-50: #f4f4f5;
    --ink-100: #e4e4e7;
    --ink-200: #c7c7cc;
    --ink-300: #9b9ba3;
    --ink-400: #707078;
    --ink-500: #3f4047;
    --accent: #8ab4ff;      /* accent-blue */
    --green: #7bd88f;       /* accent-green */
    --red: #ff7b72;         /* accent-red */
    --surface: rgba(255,255,255,.05);
    --surface-hover: rgba(255,255,255,.09);
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink-100);
    font: 14px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden;
  }
  button { font: inherit; }

  #app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100dvh; }
  body.collapsed #app { grid-template-columns: 0 1fr; }

  /* Sidebar — mirrors codex-sidebar */
  aside {
    grid-column: 1; min-width: 0; overflow: hidden;
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
  }
  body.collapsed aside { border-right-color: transparent; }
  .brand {
    display: flex; align-items: center; gap: 10px; min-height: 44px;
    padding: 12px 12px 10px; border-bottom: 1px solid var(--line);
  }
  .brand img { width: 26px; height: 26px; flex: none; border-radius: 6px; }
  .brand .label { font-size: 11px; color: var(--ink-300); line-height: 1.2; }
  .brand .title { font-size: 15px; font-weight: 600; color: var(--ink-50); line-height: 1.2; white-space: nowrap; }

  .subhead { padding: 10px 14px; color: var(--ink-300); font-size: 12px; }

  .list { flex: 1 1 auto; overflow-y: auto; padding: 4px 8px 10px; -webkit-overflow-scrolling: touch; }
  .proj {
    appearance: none; width: 100%; text-align: left; cursor: pointer; color: inherit;
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    padding: 8px 10px; margin-bottom: 2px; display: flex; align-items: center; gap: 9px;
    transition: background .12s, border-color .12s;
  }
  .proj:hover { background: var(--surface); }
  .proj.active { background: rgba(138,180,255,.14); border-color: rgba(138,180,255,.35); }
  .proj .meta { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
  .proj .name { display: block; font-weight: 500; font-size: 13.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-100); }
  .proj .slug { display: block; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; line-height: 1.3; color: var(--ink-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 3px rgba(123,216,143,.14); }
  .dot.off { background: var(--ink-500); box-shadow: none; }
  .proj .open-mark { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; }
  .proj.mounted .open-mark { opacity: .9; }

  .list .status { color: var(--ink-300); padding: 10px 6px; font-size: 12.5px; }
  .list .status.err { color: var(--red); }

  .foot { border-top: 1px solid var(--line); padding: 9px 14px; color: var(--ink-400); font-size: 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .foot button { appearance: none; background: transparent; border: 0; color: var(--ink-300); cursor: pointer; font-size: 11px; padding: 2px 4px; border-radius: 4px; }
  .foot button:hover { color: var(--ink-100); background: var(--surface); }

  /* Main */
  main { grid-column: 2; min-width: 0; position: relative; display: flex; flex-direction: column; background: var(--bg); }
  .topbar {
    min-height: 44px; flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel);
    padding-top: calc(6px + env(safe-area-inset-top));
  }
  .iconbtn {
    appearance: none; cursor: pointer; color: var(--ink-200); background: var(--surface);
    border: 0; border-radius: 6px; height: 32px; min-width: 32px; padding: 0 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .12s, color .12s;
  }
  .iconbtn:hover { background: var(--surface-hover); color: var(--ink-50); }
  .iconbtn:active { transform: scale(.98); }
  .iconbtn.ghost { background: transparent; }
  .iconbtn.ghost:hover { background: var(--surface); }
  .iconbtn svg { width: 17px; height: 17px; display: block; }
  .topbar .title { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 8px; overflow: hidden; padding-left: 4px; }
  .topbar .title .t { font-weight: 600; font-size: 13.5px; color: var(--ink-100); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .title .s { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--ink-400); white-space: nowrap; }

  .frames { position: relative; flex: 1 1 auto; min-height: 0; }
  .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); display: none; }
  .frames iframe.active { display: block; }

  .welcome { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 6px; }
  .welcome.hidden { display: none; }
  .welcome img { width: 56px; height: 56px; opacity: .95; margin-bottom: 8px; border-radius: 12px; }
  .welcome h2 { margin: 0; font-size: 17px; font-weight: 600; color: var(--ink-50); }
  .welcome p { margin: 0; color: var(--ink-300); font-size: 13px; max-width: 380px; }

  /* Mobile drawer */
  .scrim { display: none; }
  @media (max-width: 720px) {
    #app, body.collapsed #app { grid-template-columns: 1fr; }
    aside {
      position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(88vw, var(--sidebar-w));
      transform: translateX(0); transition: transform .2s cubic-bezier(.2,0,0,1); box-shadow: 0 0 40px rgba(0,0,0,.5);
    }
    body.collapsed aside { transform: translateX(-102%); box-shadow: none; }
    main { grid-column: 1; }
    .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); }
    body.collapsed .scrim { display: none; }
    body:not(.collapsed) .scrim { display: block; }
  }
</style>
</head>
<body>
  <div id="app">
    <aside>
      <div class="brand">
        <img src="/icon.svg" alt="" />
        <div>
          <div class="label">Futrx</div>
          <div class="title">IDE</div>
        </div>
      </div>
      <div class="subhead" id="subhead">Workspaces</div>
      <div id="list" class="list">
        <div class="status">Loading projects…</div>
      </div>
      <div class="foot">
        <span id="count"></span>
        <button id="reload-list" type="button" title="Refresh project list">Refresh</button>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <button class="iconbtn ghost" id="toggle" title="Toggle project list" aria-label="Toggle project list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="title" id="title"><span class="t">Futrx IDE</span></div>
        <button class="iconbtn ghost" id="reload-frame" title="Reload this workspace" hidden aria-label="Reload workspace">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="iconbtn ghost" id="popout" title="Open this workspace in its own window" hidden aria-label="Open in new window">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M20 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4"/></svg>
        </button>
        <button class="iconbtn ghost" id="close-frame" title="Close this workspace" hidden aria-label="Close workspace">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="frames" id="frames">
        <div class="welcome" id="welcome">
          <img src="/icon.svg" alt="" />
          <h2>Pick a workspace</h2>
          <p>Select a project on the left to open its VS Code editor right here. Every workspace stays inside this one app.</p>
        </div>
      </div>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>

  <script>
    "use strict";
    const ideUrl = (slug) => `/${encodeURIComponent(slug)}/?folder=/workspace`;
    const isNarrow = () => matchMedia("(max-width: 720px)").matches;

    const frames = new Map();   // slug -> iframe, kept alive so editor state survives switching
    let active = null;
    let projects = [];

    const els = {
      body: document.body,
      list: document.getElementById("list"),
      frames: document.getElementById("frames"),
      welcome: document.getElementById("welcome"),
      title: document.getElementById("title"),
      count: document.getElementById("count"),
      toggle: document.getElementById("toggle"),
      scrim: document.getElementById("scrim"),
      reloadFrame: document.getElementById("reload-frame"),
      popout: document.getElementById("popout"),
      closeFrame: document.getElementById("close-frame"),
    };

    const isRunning = (p) => {
      const s = p && p.status;
      if (typeof s === "string") return s.toLowerCase() === "running";
      if (s && typeof s === "object") return (s.containerState || s.state) === "RUNNING";
      return false;
    };
    const slugOf = (p) => p.slug || p.containerName || "";
    const nameOf = (p) => p.name || slugOf(p);
    const findProject = (slug) => projects.find((p) => slugOf(p) === slug);

    const setSidebar = (open) => els.body.classList.toggle("collapsed", !open);
    setSidebar(!isNarrow());

    function mount(slug) {
      let f = frames.get(slug);
      if (!f) {
        f = document.createElement("iframe");
        f.title = slug;
        f.src = ideUrl(slug);
        f.allow = "clipboard-read; clipboard-write; fullscreen";
        els.frames.appendChild(f);
        frames.set(slug, f);
      }
      return f;
    }

    function activate(slug) {
      const p = findProject(slug);
      if (!p) return;
      mount(slug);
      active = slug;
      for (const [s, f] of frames) f.classList.toggle("active", s === slug);
      els.welcome.classList.add("hidden");

      els.title.innerHTML = "";
      const t = document.createElement("span"); t.className = "t"; t.textContent = nameOf(p);
      const s = document.createElement("span"); s.className = "s"; s.textContent = slug;
      els.title.append(t, s);
      for (const b of [els.reloadFrame, els.popout, els.closeFrame]) b.hidden = false;

      renderList();
      if (isNarrow()) setSidebar(false);
      try { history.replaceState(null, "", "/#" + encodeURIComponent(slug)); } catch (_) {}
    }

    function closeFrame(slug) {
      const f = frames.get(slug);
      if (f) { f.remove(); frames.delete(slug); }
      if (active === slug) {
        active = null;
        const next = frames.keys().next();
        if (!next.done) { activate(next.value); return; }
        els.welcome.classList.remove("hidden");
        els.title.innerHTML = '<span class="t">Futrx IDE</span>';
        for (const b of [els.reloadFrame, els.popout, els.closeFrame]) b.hidden = true;
        try { history.replaceState(null, "", "/"); } catch (_) {}
      }
      renderList();
    }

    function renderList() {
      const list = els.list;
      list.innerHTML = "";
      const items = projects
        .filter((p) => slugOf(p))
        .sort((a, b) => nameOf(a).localeCompare(nameOf(b)));

      if (!items.length) {
        const s = document.createElement("div");
        s.className = "status";
        s.textContent = "No projects yet.";
        list.appendChild(s);
      }

      for (const p of items) {
        const slug = slugOf(p);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "proj" + (slug === active ? " active" : "") + (frames.has(slug) ? " mounted" : "");
        btn.title = "Open " + slug;
        btn.innerHTML =
          '<span class="dot' + (isRunning(p) ? "" : " off") + '"></span>' +
          '<span class="meta"><span class="name"></span><span class="slug"></span></span>' +
          '<span class="open-mark"></span>';
        btn.querySelector(".name").textContent = nameOf(p);
        btn.querySelector(".slug").textContent = slug;
        btn.addEventListener("click", () => activate(slug));
        list.appendChild(btn);
      }

      const mounted = frames.size;
      els.count.textContent = items.length + " project" + (items.length === 1 ? "" : "s") +
        (mounted ? " · " + mounted + " open" : "");
    }

    async function load(initial) {
      try {
        const res = await fetch("/api/projects", { credentials: "include" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        projects = Array.isArray(data) ? data : [];
        renderList();
        if (initial) {
          const want = decodeURIComponent((location.hash || "").replace(/^#/, ""));
          if (want && findProject(want)) activate(want);
        }
      } catch (e) {
        if (initial) {
          els.list.innerHTML = "";
          const s = document.createElement("div");
          s.className = "status err";
          s.textContent = "Could not load projects: " + e.message;
          els.list.appendChild(s);
        }
      }
    }

    els.toggle.addEventListener("click", () => setSidebar(els.body.classList.contains("collapsed")));
    els.scrim.addEventListener("click", () => setSidebar(false));
    document.getElementById("reload-list").addEventListener("click", () => load(false));
    els.reloadFrame.addEventListener("click", () => { const f = active && frames.get(active); if (f) f.src = f.src; });
    els.popout.addEventListener("click", () => { if (active) window.open(ideUrl(active), "_blank", "noopener"); });
    els.closeFrame.addEventListener("click", () => { if (active) closeFrame(active); });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    load(true);
    setInterval(() => load(false), 15000);
  </script>
</body>
</html>
